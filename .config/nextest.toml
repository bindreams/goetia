# skuld has no per-test timeout by design. The `ci` profile is the failure bound for an attended CI
# run: nextest kills a test after its slow-timeout and reports it by name as TIMEOUT, unless the
# job's `timeout-minutes` cancels the run first (tests run one at a time). Either only gets a human
# to the hung test; it proves nothing about state. Outside this profile, nothing bounds a hang.
[profile.ci]
# Run every test and report every failure.
fail-fast = false
# One test at a time, as under `cargo test`, where skuld's capture mode forces a single test thread
# in a single binary at a time. The integration suites share one machine-wide service manager and
# wait on it with fixed deadlines; run in parallel, they miss those deadlines.
test-threads = 1
slow-timeout = { period = "60s", terminate-after = 5 }
# Name every skipped test (a skuld `requires` that does not hold, such as elevation) in the log:
# this project forbids a silent skip.
status-level = "skip"
final-status-level = "skip"
