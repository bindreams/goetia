# skuld has no per-test timeout by design; the `ci` profile is the failure bound: nextest kills a hung
# test after its slow-timeout and reports it by name as TIMEOUT. Outside this profile nothing bounds
# a hang. The job's `timeout-minutes` can cancel the run first, since the tests run one at a time.
[profile.ci]
# Run every test and report every failure.
fail-fast = false
# One test at a time: the integration suites share one machine-wide service manager and wait on it
# with fixed deadlines; run in parallel, they miss those deadlines.
test-threads = 1
slow-timeout = { period = "60s", terminate-after = 5 }
# Name every skipped test (a skuld `requires` that does not hold, such as elevation) in the log:
# this project forbids a silent skip.
status-level = "skip"
final-status-level = "skip"
