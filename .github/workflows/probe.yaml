name: Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  one:
    name: one test (macos)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.149

      - name: Build test binaries
        run: cargo nextest archive --locked --archive-file nextest-archive.tar.zst

      - name: Run the test, elevated
        env:
          GOETIA_TEST_LAUNCHD_CONSENT: "1"
          GOETIA_TEST_SCM_CONSENT: "1"
          GOETIA_TEST_SYSTEMD_CONSENT: "1"
        run: |
          nextest="$(command -v cargo-nextest)"
          sudo --preserve-env=GOETIA_TEST_SCM_CONSENT,GOETIA_TEST_SYSTEMD_CONSENT,GOETIA_TEST_LAUNCHD_CONSENT \
            "$nextest" nextest run --archive-file nextest-archive.tar.zst --profile ci --no-tests fail \
            -E 'test(next_run_is_the_earliest_fire_launchd_registered)' --no-capture
