name: Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  dst:
    name: dst ${{ matrix.case }} (macos)
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        case: [fall3a, fall3b]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The output goes to a file and is printed once the clock is back: a step that logs while the clock is in 2027 loses its log.
      - name: Probe
        run: |
          sudo bash .github/probe/dst.sh ${{ matrix.case }} > dst.log 2>&1
          status=$?
          cat dst.log
          exit $status

  calendar-ny:
    name: calendar in America/New_York (macos)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Build
        run: cargo build --locked --example calendar_probe --features testing

      - name: Probe
        run: |
          sudo bash .github/probe/calendar.sh target/debug/examples/calendar_probe ny > calendar.log 2>&1
          status=$?
          cat calendar.log
          exit $status
