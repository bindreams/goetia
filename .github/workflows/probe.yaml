name: Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  dst:
    name: dst ${{ matrix.case }} (macos)
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        case: [hourly_spring_a, hourly_spring_b, hourly_fall_a, hourly_fall_b]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The output goes to a file and is printed once the clock is back: a step that logs while the clock is in 2027 loses its log.
      - name: Probe
        run: |
          sudo bash .github/probe/dst.sh ${{ matrix.case }} > dst.log 2>&1
          status=$?
          cat dst.log
          exit $status
