name: launchd probe

# Throwaway measurement for launchd writable-dirs; never merged. Push is the
# trigger (workflow_dispatch needs the workflow on the default branch).
on:
  push:
    branches: ["probe/**"]

permissions:
  contents: read

env:
  PROBE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@stable

      # Build unelevated; run elevated. The job program is C: Rust's std would
      # reopen closed fds 0-2 before main and hide what launchd handed over.
      - name: Build
        run: |
          cargo build --release --manifest-path probe/Cargo.toml
          cc -O2 -Wall -Wextra -o probe/target/release/job probe/job.c

      - name: Runner
        run: |
          sw_vers
          uname -v
          csrutil status || true
          id
          df -h /

      - name: Stage
        run: |
          set -eu
          base="/tmp/goetia-probe-$PROBE_RUN"
          sudo install -d -o root -g wheel -m 0755 "$base" "$base/bin"
          sudo install -o root -g wheel -m 0755 probe/target/release/job probe/target/release/launchd-probe "$base/bin/"
          mkdir -p results

      - name: selftest
        timeout-minutes: 3
        run: sudo /usr/bin/env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" PROBE_RUN="$PROBE_RUN" RUNNER_TEMP="$RUNNER_TEMP" "/tmp/goetia-probe-$PROBE_RUN/bin/launchd-probe" selftest

      - name: F1c
        if: always()
        timeout-minutes: 3
        run: sudo /usr/bin/env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" PROBE_RUN="$PROBE_RUN" RUNNER_TEMP="$RUNNER_TEMP" "/tmp/goetia-probe-$PROBE_RUN/bin/launchd-probe" row F1c

      - name: F2c
        if: always()
        timeout-minutes: 3
        run: sudo /usr/bin/env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" PROBE_RUN="$PROBE_RUN" RUNNER_TEMP="$RUNNER_TEMP" "/tmp/goetia-probe-$PROBE_RUN/bin/launchd-probe" row F2c

      - name: F25c
        if: always()
        timeout-minutes: 3
        run: sudo /usr/bin/env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" PROBE_RUN="$PROBE_RUN" RUNNER_TEMP="$RUNNER_TEMP" "/tmp/goetia-probe-$PROBE_RUN/bin/launchd-probe" row F25c

      - name: F5l
        if: always()
        timeout-minutes: 3
        run: sudo /usr/bin/env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" PROBE_RUN="$PROBE_RUN" RUNNER_TEMP="$RUNNER_TEMP" "/tmp/goetia-probe-$PROBE_RUN/bin/launchd-probe" row F5l

      - name: F19a
        if: always()
        timeout-minutes: 3
        run: sudo /usr/bin/env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" PROBE_RUN="$PROBE_RUN" RUNNER_TEMP="$RUNNER_TEMP" "/tmp/goetia-probe-$PROBE_RUN/bin/launchd-probe" row F19a

      - name: F6l
        if: always()
        timeout-minutes: 3
        run: sudo /usr/bin/env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" PROBE_RUN="$PROBE_RUN" RUNNER_TEMP="$RUNNER_TEMP" "/tmp/goetia-probe-$PROBE_RUN/bin/launchd-probe" row F6l

      - name: F7l
        if: always()
        timeout-minutes: 3
        run: sudo /usr/bin/env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" PROBE_RUN="$PROBE_RUN" RUNNER_TEMP="$RUNNER_TEMP" "/tmp/goetia-probe-$PROBE_RUN/bin/launchd-probe" row F7l

      - name: F12l
        if: always()
        timeout-minutes: 3
        run: sudo /usr/bin/env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" PROBE_RUN="$PROBE_RUN" RUNNER_TEMP="$RUNNER_TEMP" "/tmp/goetia-probe-$PROBE_RUN/bin/launchd-probe" row F12l

      - name: F26l
        if: always()
        timeout-minutes: 3
        run: sudo /usr/bin/env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" PROBE_RUN="$PROBE_RUN" RUNNER_TEMP="$RUNNER_TEMP" "/tmp/goetia-probe-$PROBE_RUN/bin/launchd-probe" row F26l

      - name: F21b
        if: always()
        timeout-minutes: 3
        run: sudo /usr/bin/env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" PROBE_RUN="$PROBE_RUN" RUNNER_TEMP="$RUNNER_TEMP" "/tmp/goetia-probe-$PROBE_RUN/bin/launchd-probe" row F21b

      - name: F22l
        if: always()
        timeout-minutes: 3
        run: sudo /usr/bin/env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" PROBE_RUN="$PROBE_RUN" RUNNER_TEMP="$RUNNER_TEMP" "/tmp/goetia-probe-$PROBE_RUN/bin/launchd-probe" row F22l

      - name: F23l
        if: always()
        timeout-minutes: 3
        run: sudo /usr/bin/env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" PROBE_RUN="$PROBE_RUN" RUNNER_TEMP="$RUNNER_TEMP" "/tmp/goetia-probe-$PROBE_RUN/bin/launchd-probe" row F23l

      - name: F24l
        if: always()
        timeout-minutes: 3
        run: sudo /usr/bin/env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" PROBE_RUN="$PROBE_RUN" RUNNER_TEMP="$RUNNER_TEMP" "/tmp/goetia-probe-$PROBE_RUN/bin/launchd-probe" row F24l

      - name: F28l
        if: always()
        timeout-minutes: 3
        run: sudo /usr/bin/env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" PROBE_RUN="$PROBE_RUN" RUNNER_TEMP="$RUNNER_TEMP" "/tmp/goetia-probe-$PROBE_RUN/bin/launchd-probe" row F28l

      - name: F14g
        if: always()
        timeout-minutes: 3
        run: sudo /usr/bin/env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" PROBE_RUN="$PROBE_RUN" RUNNER_TEMP="$RUNNER_TEMP" "/tmp/goetia-probe-$PROBE_RUN/bin/launchd-probe" row F14g

      - name: F18g
        if: always()
        timeout-minutes: 3
        run: sudo /usr/bin/env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" PROBE_RUN="$PROBE_RUN" RUNNER_TEMP="$RUNNER_TEMP" "/tmp/goetia-probe-$PROBE_RUN/bin/launchd-probe" row F18g

      - name: F20g
        if: always()
        timeout-minutes: 3
        run: sudo /usr/bin/env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" PROBE_RUN="$PROBE_RUN" RUNNER_TEMP="$RUNNER_TEMP" "/tmp/goetia-probe-$PROBE_RUN/bin/launchd-probe" row F20g

      - name: F16l
        if: always()
        timeout-minutes: 3
        run: sudo /usr/bin/env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" PROBE_RUN="$PROBE_RUN" RUNNER_TEMP="$RUNNER_TEMP" "/tmp/goetia-probe-$PROBE_RUN/bin/launchd-probe" row F16l

      - name: F17l
        if: always()
        timeout-minutes: 3
        run: sudo /usr/bin/env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" PROBE_RUN="$PROBE_RUN" RUNNER_TEMP="$RUNNER_TEMP" "/tmp/goetia-probe-$PROBE_RUN/bin/launchd-probe" row F17l

      - name: exfat
        if: always()
        timeout-minutes: 5
        run: sudo /usr/bin/env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" PROBE_RUN="$PROBE_RUN" RUNNER_TEMP="$RUNNER_TEMP" "/tmp/goetia-probe-$PROBE_RUN/bin/launchd-probe" exfat

      - name: aggregate
        if: always()
        timeout-minutes: 2
        run: python3 probe/aggregate.py results

      - name: cleanup
        if: always()
        timeout-minutes: 3
        run: |
          for id in F1c F2c F25c F5l F19a F6l F7l F12l F26l F21b F22l F23l F24l F28l F14g F18g F20g F16l F17l; do
            sudo launchctl bootout "system/com.goetia.probe.$PROBE_RUN.$id" 2>/dev/null || true
            sudo rm -f "/Library/LaunchDaemons/com.goetia.probe.$PROBE_RUN.$id.plist"
          done

      - name: upload
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: probe-results
          path: results/

  # F29: a log FIFO with no reader may block launchd. Its own job so a block
  # cannot take other rows down; the probe's 8-minute bound inside the row is
  # the failure bound (launchd is the external party), after which it samples
  # and releases the FIFO.
  fifo-no-reader:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@stable

      # Build unelevated; run elevated. The job program is C: Rust's std would
      # reopen closed fds 0-2 before main and hide what launchd handed over.
      - name: Build
        run: |
          cargo build --release --manifest-path probe/Cargo.toml
          cc -O2 -Wall -Wextra -o probe/target/release/job probe/job.c

      - name: Runner
        run: |
          sw_vers
          uname -v
          csrutil status || true
          id
          df -h /

      - name: Stage
        run: |
          set -eu
          base="/tmp/goetia-probe-$PROBE_RUN"
          sudo install -d -o root -g wheel -m 0755 "$base" "$base/bin"
          sudo install -o root -g wheel -m 0755 probe/target/release/job probe/target/release/launchd-probe "$base/bin/"
          mkdir -p results

      - name: F29l
        timeout-minutes: 12
        run: sudo /usr/bin/env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" PROBE_RUN="$PROBE_RUN" RUNNER_TEMP="$RUNNER_TEMP" "/tmp/goetia-probe-$PROBE_RUN/bin/launchd-probe" row F29l

      - name: kill probe
        if: always()
        timeout-minutes: 1
        run: sudo pkill -f "launchd-probe row F29l" || true

      - name: phases
        if: always()
        timeout-minutes: 1
        run: cat results/F29l.phase || true

      - name: upload
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: probe-results-f29
          path: results/

      - name: bootout
        if: always()
        timeout-minutes: 2
        run: |
          sudo launchctl bootout "system/com.goetia.probe.$PROBE_RUN.F29l" 2>/dev/null || true
          sudo rm -f "/Library/LaunchDaemons/com.goetia.probe.$PROBE_RUN.F29l.plist"
