name: Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe-a:
    name: Probe A (macos)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.149

      - name: Build test binaries
        run: cargo nextest archive --locked --archive-file nextest-archive.tar.zst

      - name: Probe A, root
        run: |
          nextest="$(command -v cargo-nextest)"
          sudo env PROBE_PASSES=20000 "$nextest" nextest run --archive-file nextest-archive.tar.zst \
            --no-capture -E 'test(probe_bounded_kill_eperm)' > probe-a.log 2>&1 || true
          echo "kill errors: $(grep -c PROBE_KILL_ERR probe-a.log || true)"
          echo "wait errors: $(grep -c PROBE_WAIT_ERR probe-a.log || true)"
          echo "spawn errors: $(grep -c PROBE_SPAWN_ERR probe-a.log || true)"
          grep -E "PROBE_" probe-a.log | head -60
          tail -20 probe-a.log
