name: Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  run-hold:
    name: Probe ${{ matrix.args }} (macos)
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        args:
          - held wrap late b2b 150
          - unheld wrap late b2b 150
          - lag 600
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Platform
        run: |
          sw_vers
          uname -a
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          csrutil status || true
          id

      - name: Build
        run: cc -O1 -Wall -o run-hold .github/probe/run-hold.c

      - name: Probe
        run: sudo ./run-hold ${{ matrix.args }}

      - name: Clean up
        if: always()
        run: |
          sudo launchctl bootout system/goetia.probe.runhold || true
          sudo rm -f /Library/LaunchDaemons/goetia.probe.runhold.plist /tmp/goetia-probe-runhold.log
