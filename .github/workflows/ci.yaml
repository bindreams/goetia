name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs; let main / dispatch runs finish. Under
  # workflow_call the `github` context is the CALLER's, so without this,
  # two Draft Release dispatches on main would land in the same
  # concurrency group and the second would silently cancel the first's CI
  # job — the gate that is supposed to prove the release commit is green.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # kill_tree_windows's logic (taskkill argv, stderr surfacing, the
      # unconditional proc.kill() backstop) faked against subprocess.run --
      # touches no real process, so it runs on every OS in this matrix.
      - name: Test run-with-timeout.py (unit)
        shell: bash
        run: cd .github/scripts && python3 -B -m unittest run-with-timeout-unit-tests -v

      # run-with-timeout.py's POSIX path kills by session through `ps` and
      # `getsid`, whose behaviour differs between Linux and macOS, so it needs
      # both to cover it; this matrix is the only job that runs on both.
      - name: Test run-with-timeout.py (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: bash .github/scripts/run-with-timeout-tests.sh

      # kill_tree_windows's real taskkill/process-tree behavior needs an
      # actual Windows host and taskkill to exercise; the unit step above
      # only fakes both.
      - name: Test run-with-timeout.py (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: python3 .github/scripts/run-with-timeout-windows-tests.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # A plain `cargo test` leaves every elevation-gated test reported by
      # skuld as *unavailable*, not failed — a silent skip, which this
      # project forbids. Build unelevated, then run each produced test
      # binary elevated (sudo on Linux/macOS; the Windows runner is already
      # Administrator). Never `sudo -E cargo test`: `-E` preserves `HOME`,
      # so root would write to `~/.cargo`/`target/` and the next unelevated
      # build would fail with `EACCES`. Locating the binaries by hand (via
      # `--message-format=json`) rather than shelling out to `cargo test`
      # under `sudo` keeps `cargo` itself entirely unelevated.
      - name: Build test binaries
        run: cargo test --locked --no-run --message-format=json > cargo-test-artifacts.json

      - name: Run tests, elevated
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' > test-binaries.txt
          import json

          with open("cargo-test-artifacts.json") as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  msg = json.loads(line)
                  if (
                      msg.get("reason") == "compiler-artifact"
                      and msg.get("profile", {}).get("test")
                      and msg.get("executable")
                  ):
                      print(msg["executable"])
          PY

          .github/scripts/assert-test-binaries.sh test-binaries.txt

          # The job exits with the FIRST failure's code, and every failing
          # binary is named with its own: `124` (the watchdog fired) and a
          # test failure mean different things, and keeping only one code
          # would let either mask the other.
          status=0
          failures=()
          while IFS= read -r bin; do
            # Strip a trailing CR: on Windows, Python's text-mode stdout
            # writes CRLF, and bash's `read` does not strip it — an
            # unstripped `\r` makes the path unresolvable at exec time.
            bin="${bin%$'\r'}"
            if [[ -z "$bin" ]]; then
              continue
            fi
            echo "::group::$bin"
            # The watchdog runs INSIDE the elevation: one outside `sudo`
            # cannot signal the root process it started. The interpreter is
            # resolved before `sudo`, not by it — `sudo` resets `PATH` to
            # its own `secure_path`, which the macOS runner's toolcache
            # `python3` is not on.
            bin_status=0
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              python3 .github/scripts/run-with-timeout.py 600 "$bin" || bin_status=$?
            else
              sudo "$(command -v python3)" .github/scripts/run-with-timeout.py 600 "$bin" || bin_status=$?
            fi
            echo "::endgroup::"
            if [[ "$bin_status" -ne 0 ]]; then
              failures+=("exit ${bin_status}: ${bin}")
              if [[ "$status" -eq 0 ]]; then
                status="$bin_status"
              fi
            fi
          done < test-binaries.txt

          if [[ "${#failures[@]}" -gt 0 ]]; then
            printf '::error::%s\n' "${failures[@]}"
          fi
          exit "$status"

      # See `tests/support/mod.rs::record_probe`.
      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: probe-results-${{ matrix.os }}
          path: probe-results/
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: lint

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install prek
        # renovate: datasource=pypi depName=prek
        run: uv tool install prek==0.5.3

      # cargo-clippy is skipped here because it already runs per-platform in
      # the `test` job above (the `#[cfg]` halves differ per platform, so a
      # single-platform clippy run would miss them).
      - name: Run linters
        env:
          SKIP: cargo-clippy
        run: prek run --all-files

      - name: Test release helper scripts
        shell: bash
        run: bash .github/scripts/release-script-tests.sh

  # A separate job (rather than a step inside `test`, which already takes
  # twenty minutes) so it runs in parallel. All three hosts: the dry-run
  # only ever compiles for its own host, and `test` builds the *repository*
  # rather than the *tarball*, so nothing else here would catch an
  # `exclude` that breaks a non-Linux build — goetia is more exposed to
  # this than most crates, since `src/bin/shim` is `#[cfg(windows)]`-gated
  # internally and the three backends have disjoint dependency sets.
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: package

      - name: Dry-run cargo publish
        run: cargo publish --dry-run --locked

      # Proves the package *builds*, which the dry-run above already does —
      # not that an `exclude` entry in Cargo.toml is still doing anything.
      # The listing is written outside the workspace: a listing file
      # created in the package root becomes an uncommitted, non-excluded
      # file that cargo sees as a dirty worktree, and the guard would abort
      # before it ever ran.
      - name: Assert the package excludes stayed excluded
        shell: bash
        run: |
          set -euo pipefail
          list="${RUNNER_TEMP}/pkg-list.txt"
          cargo package --list --locked > "$list"
          bash .github/scripts/assert-package-list.sh "$list"
