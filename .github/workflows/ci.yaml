name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs; let main / dispatch runs finish. Under
  # workflow_call the `github` context is the CALLER's, so without this,
  # two Draft Release dispatches on main would land in the same
  # concurrency group and the second would silently cancel the first's CI
  # job — the gate that is supposed to prove the release commit is green.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Every job except the `stable` test leg builds with `Cargo.toml`'s `rust-version`, so the declared
  # floor is the one checked. Read with `tomllib`: the toolchain install needs the version before that toolchain exists.
  rust-version:
    name: Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.rust.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read the Rust version
        id: rust
        run: python3 -I -c 'import tomllib; print("version=" + tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])' >> "$GITHUB_OUTPUT"

  # The `stable` leg tests the compiler the release workflows build with. Its checks are not required on `main`,
  # and it skips clippy: Draft Release gates on this workflow, and a lint new in stable must not block a release.
  test:
    name: Test${{ matrix.toolchain == 'stable' && ' stable' || '' }} (${{ matrix.os }})
    needs: rust-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [floor, stable]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain == 'stable' && 'stable' || needs.rust-version.outputs.version }}
          components: ${{ matrix.toolchain != 'stable' && 'clippy' || '' }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install uv
        if: matrix.toolchain != 'stable'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install prek
        if: matrix.toolchain != 'stable'
        # renovate: datasource=pypi depName=prek
        run: uv tool install prek==0.5.9

      # Clippy is defined in prek.toml: the default build (with the `testing` feature, which the
      # self dev-dependency turns on) and the library-only build.
      - name: Clippy
        if: matrix.toolchain != 'stable'
        run: prek run --all-files cargo-clippy cargo-clippy-lib-only

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          # renovate: datasource=crate depName=cargo-nextest
          tool: cargo-nextest@0.9.149

      # A plain `cargo test` leaves every elevation-gated test reported by
      # skuld as *unavailable*, not failed, a silent skip, which this
      # project forbids. Build unelevated into an archive, then run the
      # archive elevated (sudo on Linux/macOS; the Windows runner is already
      # Administrator). Never `sudo -E cargo test`: `-E` preserves `HOME`,
      # so root would write to `~/.cargo`/`target/` and the next unelevated
      # build would fail with `EACCES`. `cargo` stays entirely unelevated.
      - name: Build test binaries
        run: cargo nextest archive --locked --archive-file nextest-archive.tar.zst

      # Hung tests: see the `ci` profile in `.config/nextest.toml`.
      # `--no-tests fail` keeps a build that produced no tests from passing.
      # On Windows the archive is extracted under `target/`, not into the runner account's `%TEMP%`,
      # which other accounts cannot read: `real_account_gets_service_logon_right` runs the extracted
      # test binary as a fresh local user, and relies on `target/` being readable by it.
      # nextest wants the directory to exist, and `--extract-overwrite` lets a restored cache
      # leave one. On Linux and macOS root extracts into nextest's default temporary directory:
      # root must not write `target/`, which the next unelevated build and the cache prune need to own.
      - name: Run tests, elevated
        shell: bash
        run: |
          set -euo pipefail

          nextest="$(command -v cargo-nextest)"
          args=(nextest run --archive-file nextest-archive.tar.zst --profile ci --no-tests fail)
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mkdir -p target/nextest-extract
            "$nextest" "${args[@]}" --extract-to target/nextest-extract --extract-overwrite
          else
            # `sudo` resets `PATH`: the binary is resolved before it.
            sudo "$nextest" "${args[@]}"
          fi

      # See `tests/support/mod.rs::record_probe`.
      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: probe-results-${{ matrix.toolchain }}-${{ matrix.os }}
          path: probe-results/
          if-no-files-found: ignore

      # Last, and whatever the tests did, so a doc warning hides no test result. `docs.rs` builds the
      # three OS targets, and links to `#[cfg]`-gated items resolve on one OS and break on another, so
      # each OS runs the doc hooks.
      - name: Rustdoc
        if: ${{ !cancelled() && matrix.toolchain != 'stable' }}
        run: prek run --stage manual --all-files cargo-doc cargo-doc-lib-only cargo-doc-tests

  lint:
    name: Lint
    needs: rust-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ needs.rust-version.outputs.version }}
          components: rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: lint

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install prek
        # renovate: datasource=pypi depName=prek
        run: uv tool install prek==0.5.10

      # The clippy hooks are skipped here because they already run per-platform
      # in the `test` job above (the `#[cfg]` halves differ per platform, so a
      # single-platform clippy run would miss them).
      - name: Run linters
        env:
          SKIP: cargo-clippy,cargo-clippy-lib-only
        run: prek run --all-files

      - name: Test release helper scripts
        shell: bash
        run: bash .github/scripts/release-script-tests.sh

  # A separate job (rather than a step inside `test`, which already takes
  # twenty minutes) so it runs in parallel. All three hosts: the dry-run
  # only ever compiles for its own host, and `test` builds the *repository*
  # rather than the *tarball*, so nothing else here would catch an
  # `exclude` that breaks a non-Linux build — goetia is more exposed to
  # this than most crates, since the shim's code is `#[cfg(windows)]`-gated
  # internally and the three backends have disjoint dependency sets.
  package:
    name: Package (${{ matrix.os }})
    needs: rust-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ needs.rust-version.outputs.version }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: package

      - name: Dry-run cargo publish
        run: cargo publish --dry-run --locked

      # Proves the package *builds*, which the dry-run above already does —
      # not that an `exclude` entry in Cargo.toml is still doing anything.
      # The listing is written outside the workspace: a listing file
      # created in the package root becomes an uncommitted, non-excluded
      # file that cargo sees as a dirty worktree, and the guard would abort
      # before it ever ran.
      - name: Assert the package excludes stayed excluded
        shell: bash
        run: |
          set -euo pipefail
          list="${RUNNER_TEMP}/pkg-list.txt"
          cargo package --list --locked > "$list"
          bash .github/scripts/assert-package-list.sh "$list"

  # A library consumer of the *packaged* crate ships the stock shim, and goetia's own two-stage and
  # `cargo install` builds do too. Windows only, and elevated like the `test` job's runner: the round
  # trips install a `type: simple` service. See `.github/scripts/consumer-build-tests.sh`.
  consumer-build:
    name: Consumer build (windows-latest)
    needs: rust-version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ needs.rust-version.outputs.version }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: consumer-build

      - name: Build and install the stock shim as a consumer
        shell: bash
        run: bash .github/scripts/consumer-build-tests.sh
