name: probe-scm-stop
on:
  push:
    branches: [probe/scm-stop-exit-code]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cargo build --manifest-path probe/svc/Cargo.toml
      - run: ./probe/probe3.ps1 *> probe3-results.txt
        timeout-minutes: 20
        shell: pwsh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: probe-results
          path: |
            probe3-results.txt
