name: Probe Task Scheduler duplicate

# Throwaway measurement for goetia slice 5 (Task 3 Step 0); never merged. Push to probe/taskschd-dup is the trigger.
on:
  push:
    branches: ["probe/taskschd-dup"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  probe:
    name: dup
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build tsprobe
        shell: pwsh
        run: cargo build --release --locked --manifest-path probe/taskschd-dup/Cargo.toml

      - name: Probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe-results | Out-Null
          Set-Location probe/taskschd-dup
          & ./dup.ps1 *>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/probe-results/dup.txt"
          exit 0

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: probe-dup
          path: probe-results/
          if-no-files-found: ignore
