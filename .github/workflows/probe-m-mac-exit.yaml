name: Probe m-mac-exit

on:
  push:
    branches: [probe/m-mac-exit]

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15]
    defaults:
      run:
        shell: bash
        working-directory: probe/m-mac-exit

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Platform
        run: |
          exec 2>&1
          sw_vers
          uname -a
          sysctl -n hw.ncpu hw.model
          echo "ImageOS=${ImageOS:-} ImageVersion=${ImageVersion:-}"
          id

      - name: Build
        run: |
          set -euxo pipefail
          exec 2>&1
          cc -O1 -Wall -o exitwindow exitwindow.c
          cc -O1 -Wall -pthread -o signalthread signalthread.c
          cc -o sigterm-logger sigterm-logger.c
          cc -O1 -Wall -o kill-eperm token-signal-eperm.c
          (cd cosca-probe && cargo build --release --locked)
          cp cosca-probe/target/release/cosca-probe ./cosca-probe-bin
          grep -A1 '^name = "cosca"' cosca-probe/Cargo.lock

      # Question 3: Child::kill in the exit window, cosca 0.10.0.
      - name: Q3 Child::kill in the exit window
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          exec 2>&1
          for rep in 1 2; do
            for variant in first self; do
              echo "--- root, rep $rep"
              sudo ./cosca-probe-bin kill "$variant" 3000
              echo "--- runner user, rep $rep"
              ./cosca-probe-bin kill "$variant" 3000
            done
          done

      # Question 3, the kernel's side: the token send's EPERM in the exit window (the knowledge base's probe).
      - name: Q3 kernel EPERM in the exit window
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          exec 2>&1
          for rep in 1 2; do
            echo "--- root, rep $rep"
            sudo ./kill-eperm 3000 3000 1000 1000 30000 30000 5000
            echo "--- runner user, rep $rep"
            ./kill-eperm 3000 3000 1000 1000 30000 30000 5000
          done
