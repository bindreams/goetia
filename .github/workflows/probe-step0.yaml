name: launchd probe step 0

# Throwaway measurement for the launchd owner questions; never merged. Push is the trigger.
# Generated shape: every job builds, checks guards, stages, self-checks, measures, aggregates,
# uploads and tears down. System-affecting steps run only on GitHub-hosted macOS runners.
on:
  push:
    branches: ["probe/**"]

permissions:
  contents: read

env:
  PROBE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  b0:
    name: b0 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PROBE_JOB: b0
      PROBE_IMAGE: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Build
        timeout-minutes: 15
        run: |
          cargo build --release --manifest-path probe/Cargo.toml
          cc -O2 -Wall -Wextra -o probe/target/release/job probe/job.c
      - name: Guards and runner info
        timeout-minutes: 3
        run: |
          set +e
          env -u RUNNER_ENVIRONMENT probe/target/release/launchd-probe step0 b1
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then echo "guard self-check: exit $code, want 2" >&2; exit 1; fi
          if ls -d /private/var/goetia-probe-* 2>/dev/null; then echo "guard self-check: something was created" >&2; exit 1; fi
          mkdir -p "results/$PROBE_JOB"
          probe/target/release/launchd-probe step0 runner-info
      - name: Stage
        timeout-minutes: 3
        run: probe/stage.sh
      - name: Self-check selftest
        timeout-minutes: 3
        run: probe/run.sh selftest
      - name: Self-check verdicts
        if: always()
        timeout-minutes: 5
        run: probe/run.sh selfcheck-verdicts
      - name: B1
        if: always()
        timeout-minutes: 10
        run: probe/run.sh b1
      - name: B2
        if: always()
        timeout-minutes: 10
        run: probe/run.sh b2
      - name: B3
        if: always()
        timeout-minutes: 10
        run: probe/run.sh b3
      - name: B4
        if: always()
        timeout-minutes: 10
        run: probe/run.sh b4
      - name: B5
        if: always()
        timeout-minutes: 10
        run: probe/run.sh b5
      - name: Self-check result schema
        if: always()
        timeout-minutes: 2
        run: python3 probe/aggregate.py --check results
      - name: Aggregate
        if: always()
        timeout-minutes: 2
        run: python3 probe/aggregate.py report results
      - name: Upload
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: probe-step0-b0-${{ matrix.os }}
          path: results/
          if-no-files-found: warn
      - name: Teardown
        if: always()
        timeout-minutes: 10
        run: probe/run.sh teardown
      - name: Verify teardown
        if: always()
        timeout-minutes: 3
        run: probe/verify.sh

