name: Probe Task Scheduler either-or triggers

# Throwaway measurement for goetia slice 5 (Task 4 Step 0); never merged. Push to probe/taskschd-or is the trigger.
on:
  push:
    branches: ["probe/taskschd-or"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  probe:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: or-system, cmd: "dupor.ps1 -Kind system"}
          - {name: or-user, cmd: "dupor.ps1 -Kind user"}
          - {name: rep, cmd: "orrep.ps1"}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build tsprobe
        shell: pwsh
        run: cargo build --release --locked --manifest-path probe/taskschd-or/Cargo.toml

      - name: Probe (${{ matrix.name }})
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe-results | Out-Null
          Set-Location probe/taskschd-or
          & ./${{ matrix.cmd }} *>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/probe-results/${{ matrix.name }}.txt"
          exit 0

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: probe-${{ matrix.name }}
          path: probe-results/
          if-no-files-found: ignore
