[package]
name = "goetia"
version = "0.1.0"
edition = "2024"
# `cosca` uses `std::io::PipeReader`, stable since 1.87. That is already true
# on Windows, where cosca has been a dependency all along, and the Unix
# backends' bounded wait (`backend::bounded`) extends the same requirement to
# Linux and macOS. Not verified end to end: CI pins `dtolnay/rust-toolchain`
# at `stable` on every job, so nothing checks this floor.
rust-version = "1.87"
description = "Install system daemons described in goetia.yaml as native Windows/SCM, macOS/launchd, and Linux/systemd services"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/bindreams/goetia"
authors = ["bindreams"]
keywords = ["daemon", "service", "systemd", "launchd", "windows-service"]
categories = ["command-line-utilities", "os"]
exclude = ["/.github", "/.claude", "/scripts", "/prek.toml", "/.editorconfig", "/.gitattributes", "/.rustfmt.toml"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[[bin]]
name = "goetia"
path = "src/main.rs"
harness = false
required-features = ["cli"]

# Windows-only (the service host `type: simple` daemons run under), but not
# `required-features`-gated the way `goetia` is `cli`-gated: there is no
# platform-conditional feature in Cargo, so this target's own source is
# `#[cfg(windows)]`-gated internally instead (see `src/bin/shim/main.rs`) and
# reduces to an inert stub on every other target — it still needs to *build*
# everywhere so `cargo test`/`cargo clippy --all-targets` stay green on
# Linux/macOS CI, and so `CARGO_BIN_EXE_goetia-shim` resolves unconditionally
# for `tests/shim_integration.rs`, whose own real assertions are themselves
# `#[cfg(windows)]`-gated.
[[bin]]
name = "goetia-shim"
path = "src/bin/shim/main.rs"
harness = false

[lib]
name = "goetia"
path = "src/lib.rs"
harness = false

[features]
default = ["cli"]
# CLI-only deps (clap, output formatting, and the elevation check) are
# optional behind this feature, so
# `goetia = { version = "0.1", default-features = false }` stays a clean
# library dependency (see the design spec's crate table, §1).
cli = ["dep:clap", "dep:libc"]

[dependencies]
base64 = "0.23"
clap = { version = "4.6.6", features = ["derive"], optional = true }
# The shim's process-tree containment, spawn, and waiting: `.contain()` is a
# Windows Job Object with `KILL_ON_JOB_CLOSE`, and `wait()`/`wait_tree()` are
# real, event-driven kernel waits — see `src/bin/shim/service.rs`. Also the
# Unix backends' bounded subprocess wait (`backend::bounded`): `Child::wait_deadline`
# and `Child::kill_tree` bound and reap the `systemctl`/`launchctl` calls
# `daemon start --timeout` waits on. 0.x with an explicitly unstable API.
cosca = "0.4"
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
tempfile = "3"
thiserror = "2"
yaml_serde = "0.10.7"

[target.'cfg(unix)'.dependencies]
# Only `geteuid()`, for the CLI's elevation check.
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Unconditional (not behind the `cli` feature): the systemd backend itself
# classifies a unit path with `O_PATH | O_NOFOLLOW` before opening it for
# reading (see `manager::discover::classify_and_read`), and `O_PATH` is not
# uniform across the architectures this target covers — `0x1000000` on sparc,
# `0o10000000` everywhere else — so unlike the flags beside it, it cannot be
# hardcoded.
libc = "0.2"
# `openat`, for the same classifier: both of its opens resolve one final
# component under one directory descriptor, which is what makes `ELOOP` mean
# "that component is a symlink" and nothing else. Also unconditional, and the
# same version the launchd backend already takes.
nix = { version = "0.31", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Unconditional (not behind the `cli` feature): the launchd backend itself
# needs `getpwnam`/`getpwuid`/`chown` to resolve `spec::User` to a real
# account and to hand cwd/logs directories to it, regardless of whether the
# CLI's own optional deps are pulled in.
libc = "0.2"
nix = { version = "0.31", features = ["user", "fs"] }

[target.'cfg(windows)'.dependencies]
# The real SCM backend (`src/backend/scm/manager.rs`) plus the CLI's
# elevation probe. Not `optional`/`cli`-gated: `manager::native()` needs it
# on every Windows build regardless of the `cli` feature, since it is part
# of the core library, not CLI-only output formatting.
windows-service = "0.8"
# `Services\<name>\Parameters` (the metadata blob) and `Services\<name>\Environment`
# (see `manager::registry`) are read and written directly through the
# registry: `windows-service`'s `ServiceConfig` exposes neither.
winreg = "0.56"
# The handful of Win32 calls `windows-service` does not wrap: a real
# `NotifyServiceStatusChangeW` wait (`manager::scm_wait`, replacing a
# checkpoint/`Sleep` poll), `SeServiceLogonRight` provisioning
# (`manager::identity`), and `CommandLineToArgvW` for readback (SCM stores
# `executable`+`arguments` pre-joined into one command line).
#
# The shim (`src/bin/shim/`, same crate/dependency graph — see the
# `goetia-shim` `[[bin]]` above) adds `Win32_System_EventLog`, the
# version-skew/log-path-denied fallback channel — see
# `src/bin/shim/logging.rs`. Process-tree containment (the Windows Job
# Object a supervised daemon's whole descendant tree is killed through) is
# `cosca`'s own dependency, not a windows-sys feature this crate needs to
# request itself.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Authentication_Identity",
    "Win32_System_EventLog",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
skuld = "0.3"
rand = "0.10"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[test]]
name = "marker_inertness"
path = "tests/marker_inertness.rs"
harness = false

[[test]]
name = "cli_dispatch"
path = "tests/cli_dispatch.rs"
harness = false

[[test]]
name = "cli_binary"
path = "tests/cli_binary.rs"
harness = false

[[test]]
name = "systemd_integration"
path = "tests/systemd_integration.rs"
harness = false

[[test]]
name = "launchd_integration"
path = "tests/launchd_integration.rs"
harness = false

[[test]]
name = "scm_integration"
path = "tests/scm_integration.rs"
harness = false

[[test]]
name = "shim_integration"
path = "tests/shim_integration.rs"
harness = false
