[package]
name = "goetia"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Install system daemons described in goetia.yaml as native Windows/SCM, macOS/launchd, and Linux/systemd services"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/bindreams/goetia"
authors = ["bindreams"]

[[bin]]
name = "goetia"
path = "src/main.rs"
harness = false

[lib]
name = "goetia"
path = "src/lib.rs"
harness = false

[dependencies]

[dev-dependencies]
skuld = "0.3"
base64 = "0.22"
rand = "0.9"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-service = "0.8"
winreg = "0.55"

[[test]]
name = "marker_inertness"
path = "tests/marker_inertness.rs"
harness = false
