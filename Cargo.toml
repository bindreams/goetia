[package]
name = "goetia"
version = "0.3.0"
edition = "2024"
# Let-chains and `slice::as_chunks` (both stable in 1.88) force the floor; `sha2` 0.11, which hashes the
# stock shim on Windows, declares 1.88 too.
rust-version = "1.88"
description = "Install system daemons described in goetia.yaml as native Windows/SCM, macOS/launchd, and Linux/systemd services"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/bindreams/goetia"
authors = ["bindreams"]
keywords = ["daemon", "service", "systemd", "launchd", "windows-service"]
categories = ["command-line-utilities", "os"]
exclude = ["/.github", "/.claude", "/CLAUDE.md", "/scripts", "/prek.toml", "/.editorconfig", "/.gitattributes", "/.rustfmt.toml"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[[bin]]
name = "goetia"
path = "src/main.rs"
harness = false
required-features = ["cli"]

# The stock shim: the Windows service host `type: simple` daemons run under.
# `goetia::stock_shim!()` expands to its `fn main`, so this target is one line
# and builds on every target (the library's `shim::main` reduces to an
# "only on Windows" exit elsewhere), so `CARGO_BIN_EXE_goetia-shim` resolves
# unconditionally for `tests/shim_integration.rs`. Its code is
# `backend::scm::shim::run` in the library. No `required-features`: Cargo has
# no platform-conditional feature. goetia.exe installs it from beside itself
# (`cargo install` and `cargo build` lay both binaries out together) unless
# built with the `goetia-shim` feature, which embeds it instead.
[[bin]]
name = "goetia-shim"
path = "src/bin/goetia-shim.rs"

[lib]
name = "goetia"
path = "src/lib.rs"
harness = false

[features]
default = ["cli"]
# CLI-only deps (clap and output formatting) are optional behind this feature, so
# `goetia = { version = "0.1", default-features = false }` stays a clean
# library dependency (see the design spec's crate table, §1).
cli = ["dep:clap"]
# Set only by a build that embeds the stock shim (`goetia::embed_shim!()` is `Some` under it). The
# release workflow turns it on for the `goetia` binary, whose `stock_shim()` then embeds it rather
# than reading `goetia-shim.exe` beside it; the library never reads it.
goetia-shim = []
# Exports helpers the crate's own tests share; adds items only, gates no behaviour. `skuld` is the
# `ELEVATED` label's.
testing = ["dep:skuld"]

[dependencies]
base64 = "0.23"
clap = { version = "4.6.6", features = ["derive"], optional = true }
# The shim's process-tree containment, spawn, and waiting: `.contain()` is a
# Windows Job Object with `KILL_ON_JOB_CLOSE`, and `wait()`/`wait_tree()` are
# real, event-driven kernel waits — see `src/backend/scm/shim/run/service.rs`. Also the
# Unix backends' bounded subprocess wait (`backend::bounded`): `Child::wait_deadline`
# and `Child::kill_tree` bound and reap the `systemctl`/`launchctl` calls
# `daemon start --timeout` waits on. 0.x with an explicitly unstable API.
cosca = "0.4"
# `backend::bounded::collect`'s reader channel: `Receiver::len()` is a
# race-free snapshot of what is already queued, which is what lets `collect`
# stop exactly at the deadline instead of draining however long a reader
# keeps producing (`std::sync::mpsc` has no equivalent — `recv_timeout(ZERO)`
# still returns a queued item rather than timing out).
crossbeam-channel = "0.5.17"
humantime = "2"
# The marker scan (`backend::scm::shim::marker`): a SIMD substring search, so a multi-gigabyte host
# costs one fast pass.
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
# Only under `testing`: the `ELEVATED` label of `testing::elevation`. The dev-dependency below is the
# unit tests' own.
skuld = { version = "0.3", optional = true }
tempfile = "3"
thiserror = "2"
yaml_serde = "0.10.7"

[target.'cfg(target_os = "linux")'.dependencies]
# Unconditional (not behind the `cli` feature): the systemd backend itself
# classifies a unit path with `O_PATH | O_NOFOLLOW` before opening it for
# reading (see `manager::discover::classify_and_read`), and `O_PATH` is not
# uniform across the architectures this target covers — `0x1000000` on sparc,
# `0o10000000` everywhere else — so unlike the flags beside it, it cannot be
# hardcoded.
libc = "0.2"
# `openat`, for the same classifier: both of its opens resolve one final
# component under one directory descriptor, which is what makes `ELOOP` mean
# "that component is a symlink" and nothing else. Also unconditional, and the
# same version the launchd backend already takes.
nix = { version = "0.31", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Unconditional (not behind the `cli` feature): the launchd backend itself
# needs `getpwnam`/`getpwuid`/`chown` to resolve `spec::User` to a real
# account and to hand cwd/logs directories to it, regardless of whether the
# CLI's own optional deps are pulled in.
libc = "0.2"
nix = { version = "0.31", features = ["user", "fs"] }

[target.'cfg(windows)'.dependencies]
# The real SCM backend (`src/backend/scm/manager.rs`). Not `optional`/`cli`-gated:
# `manager::native()` needs it on every Windows build regardless of the `cli`
# feature, since it is part of the core library, not CLI-only output formatting.
windows-service = "0.8"
# `EmbeddedStockShim` names the stock shim by the SHA-256 of its bytes and verifies a file
# of that name against it.
sha2 = "0.11.1"
# `Services\<name>\Parameters` (the metadata blob) and `Services\<name>\Environment`
# (see `manager::registry`) are read and written directly through the
# registry: `windows-service`'s `ServiceConfig` exposes neither.
winreg = "0.56"
# The handful of Win32 calls `windows-service` does not wrap: a real
# `NotifyServiceStatusChangeW` wait (`scm::wait`, replacing a
# checkpoint/`Sleep` poll), `SeServiceLogonRight` provisioning
# (`manager::identity`), `CommandLineToArgvW` for readback (SCM stores
# `executable`+`arguments` pre-joined into one command line), and
# `RegQueryValueExW` and `RegEnumValueW`, which read an `Environment` or `Parameters` value of any
# type where `winreg` fails on one above `REG_QWORD`, and `NtDeleteValueKey` and `NtOpenKey`, which
# remove a name that holds a NUL by its stated length where `RegDeleteValueW` would stop at it
# (`manager::registry`); the owner and DACL reads of the shim folder check (`scm::shim::acl`), the
# protected DACL a shim file is created with, and `%ProgramFiles%` (`SHGetKnownFolderPath`, whose
# string `CoTaskMemFree` releases: `Win32_System_Com`).
#
# The shim (`src/backend/scm/shim/run/`) adds `Win32_System_EventLog`, the
# version-skew/log-path-denied fallback channel — see
# `src/backend/scm/shim/run/os/eventlog.rs`. Process-tree containment (the Windows Job
# Object a supervised daemon's whole descendant tree is killed through) is
# `cosca`'s own dependency, not a windows-sys feature this crate needs to
# request itself.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Authentication_Identity",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_EventLog",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Wdk_Foundation",
    "Wdk_System_Registry",
] }

[dev-dependencies]
# Turns on `testing` for the integration tests, which reach the library only through its public API.
# Without `default-features = false` it would also turn on `cli` in a `--no-default-features` build.
goetia = { path = ".", default-features = false, features = ["testing"] }
skuld = "0.3"
rand = "0.10"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[test]]
name = "marker_inertness"
path = "tests/marker_inertness.rs"
harness = false

[[test]]
name = "cli_dispatch"
path = "tests/cli_dispatch.rs"
harness = false

[[test]]
name = "cli_binary"
path = "tests/cli_binary.rs"
harness = false

[[test]]
name = "systemd_integration"
path = "tests/systemd_integration.rs"
harness = false

[[test]]
name = "launchd_integration"
path = "tests/launchd_integration.rs"
harness = false

[[test]]
name = "scm_integration"
path = "tests/scm_integration.rs"
harness = false

[[test]]
name = "shim_integration"
path = "tests/shim_integration.rs"
harness = false
